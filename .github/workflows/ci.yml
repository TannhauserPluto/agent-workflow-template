name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Basic checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Show repository state
        run: |
          git status --short
          find . -maxdepth 3 -type f | sort

      - name: Run project checks
        run: just check
